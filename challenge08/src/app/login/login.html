<div style="max-width: 400px; margin: 2rem auto; padding: 1.5rem; border: 1px solid #ccc; border-radius: 8px;">
  <h2>Iniciar Sesión</h2>
  <form (ngSubmit)="entrar()">
    <div style="margin-bottom: 1rem;">
      <label>Correo Electrónico:</label><br />
      <input type="email" [(ngModel)]="email" name="email" required style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;" />
    </div>

    <div style="margin-bottom: 1rem;">
      <label>Contraseña:</label><br />
      <input type="password" [(ngModel)]="password" name="password" required style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;" />
    </div>

    @if (error()) {
      <p style="color: red; font-size: 0.9rem;">{{ error() }}</p>
    }

    <button type="submit" style="padding: 0.5rem 1rem; cursor: pointer;">Ingresar</button>
  </form>
</div>
