<main class="login">
  <form class="panel login__card" (ngSubmit)="entrar()">
    <h1>✅ Mis tareas</h1>
    <p class="login__subtitle">Inicia sesión o crea tu cuenta</p>

    <label class="field">
      Correo
      <input type="email" name="email" [(ngModel)]="email" placeholder="Correo" required autocomplete="email" />
    </label>

    <label class="field">
      Contraseña
      <input type="password" name="clave" [(ngModel)]="clave" placeholder="Contraseña" required minlength="6" autocomplete="current-password" />
    </label>

    @if (msg()) {
      <p class="alert" [class.alert--error]="esError()" [class.alert--info]="!esError()" role="alert">{{ msg() }}</p>
    }

    <button class="btn" type="submit" [disabled]="ocupado()">Entrar</button>
    <button class="btn btn--ghost" type="button" [disabled]="ocupado()" (click)="registrar()">Crear cuenta</button>
  </form>
</main>
