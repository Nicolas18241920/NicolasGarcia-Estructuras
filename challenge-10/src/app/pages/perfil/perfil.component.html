<main class="page">
  <h1>Mi perfil</h1>

  <section class="panel box">
    <h2>Foto de perfil</h2>

    @if (url()) {
      <img class="avatar" [src]="url()" alt="Foto de perfil" width="160" height="160" />
    } @else {
      <div class="avatar avatar--vacio">Sin foto</div>
    }

    <label class="btn upload">
      {{ subiendo() ? 'Subiendo…' : 'Elegir imagen' }}
      <input type="file" accept="image/*" [disabled]="subiendo()" (change)="subir($event)" hidden />
    </label>

    @if (error()) {
      <p class="alert alert--error" role="alert">{{ error() }}</p>
    }
  </section>
</main>
