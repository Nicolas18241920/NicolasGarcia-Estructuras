@if (auth.isLoggedIn()) {
  <header class="nav">
    <strong class="nav__brand">✅ Mis tareas</strong>
    <nav class="nav__links">
      <a routerLink="/tareas" routerLinkActive="active">Tareas</a>
      <a routerLink="/perfil" routerLinkActive="active">Perfil</a>
    </nav>
    <div class="nav__user">
      <span>{{ auth.email() }}</span>
      <button type="button" class="btn btn--ghost" (click)="salir()">Salir</button>
    </div>
  </header>
}

<router-outlet />
